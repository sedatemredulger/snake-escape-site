<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake Escape</title>
<style>
  :root{ --bg:#BFDCD8; --card:#E4F2EF; --ink:#123A3C; --soft:#4E7A7B; --edge:#9FC7C1; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#131822; --card:#1B2231; --ink:#E4EAF4; --soft:#93A0B8; --edge:#2C3549; }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.65; padding:40px 18px;
  }
  .wrap{ max-width:620px; margin:0 auto; }
  .card{ background:var(--card); border:1px solid var(--edge); border-radius:16px; padding:26px 24px; }
  h1{ font-size:30px; margin:0 0 6px; letter-spacing:-.02em; }
  p.sub{ color:var(--soft); margin:0 0 22px; }
  a{ color:inherit; display:block; padding:13px 16px; margin-bottom:9px;
     border:1px solid var(--edge); border-radius:11px; text-decoration:none; font-weight:600; }
  a:hover{ background:var(--bg); }
  footer{ color:var(--soft); font-size:13px; margin-top:22px; text-align:center; }
</style>
</head>
<body>
  <div class="wrap"><div class="card">
    <h1>Snake Escape</h1>
    <p class="sub">Kayan yılan bulmacası · Sliding snake puzzle<br>Düka Games</p>
    <a href="gizlilik.html">Gizlilik Politikası (Türkçe)</a>
    <a href="privacy.html">Privacy Policy (English)</a>
    <footer>Düka Games · İletişim / Contact: sedatemredulger@gmail.com</footer>
  </div></div>
</body>
</html>
